name: Release

# Each package is released on its own tag: `sdk-v0.1.0` publishes @submilli/sdk,
# `ai-sdk-v0.1.0` @submilli/ai-sdk, `mastra-v0.1.0` @submilli/mastra, with npm
# provenance. Release @submilli/sdk before an integration that needs it.
#
# Publishing authenticates through npm trusted publishing (OIDC): each package's
# settings on npmjs.com name this workflow and the `npm` environment as its
# trusted publisher, so no npm token is stored here. The environment only lets
# release tags (`*-v*`) deploy.
on:
  push:
    tags: ["sdk-v*", "ai-sdk-v*", "mastra-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Read the package and version from the tag
        id: tag
        run: |
          dir="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          test -d "packages/$dir"
          test "$(node -p "require('./packages/$dir/package.json').version")" = "$version"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test --workspace packages/${{ steps.tag.outputs.dir }}
      - run: npm publish --workspace packages/${{ steps.tag.outputs.dir }} --provenance --access public
