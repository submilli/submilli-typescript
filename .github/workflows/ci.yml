name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Batch documentation requires this runtime commit until its next release.
  SUBMILLI_RUNTIME_REF: "1f1377033809fe459354f7ec8f1787cd1fe5e845"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build, and check what would be published
        run: npm run check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/checkout@v7
        with:
          repository: submilli/submilli-runtime
          ref: ${{ env.SUBMILLI_RUNTIME_REF }}
          path: runtime
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build the runtime with batch documentation
        run: cargo build --locked --release -p submilli-server
        working-directory: runtime
        env:
          CARGO_BUILD_JOBS: "2"
      - run: npm ci
      - run: npm run test:integration --workspaces
        env:
          SUBMILLI_BIN: ${{ github.workspace }}/runtime/target/release

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p "$RUNNER_TEMP/packs" && npm pack --workspaces --pack-destination "$RUNNER_TEMP/packs"
      - name: Each package installs and imports on its own, from its tarball
        run: |
          cd "$RUNNER_TEMP" && mkdir app && cd app && npm init -y >/dev/null
          npm pkg set type=module
          npm install ../packs/submilli-sdk-*.tgz ../packs/submilli-ai-sdk-*.tgz ../packs/submilli-mastra-*.tgz ai @mastra/core
          node -e 'import("@submilli/sdk").then((m) => { if (!m.Submilli) process.exit(1) })'
          node -e 'import("@submilli/ai-sdk").then((m) => { if (!m.submilliTools) process.exit(1) })'
          node -e 'import("@submilli/mastra").then((m) => { if (!m.createSubmilliTools) process.exit(1) })'
      - name: "The integrations depend on @submilli/sdk from npm, not the workspace"
        run: |
          for pack in "$RUNNER_TEMP"/packs/submilli-ai-sdk-*.tgz "$RUNNER_TEMP"/packs/submilli-mastra-*.tgz; do
            tar -xOzf "$pack" package/package.json \
              | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{const v=JSON.parse(s).dependencies["@submilli/sdk"];if(!/^\^\d/.test(v)){console.error(v);process.exit(1)}})'
          done
